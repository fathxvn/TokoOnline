name: tokoonline-local

services:
  app:
    build:
      context: ./docker/local
    user: "${TOKO_UID:-1000}:${TOKO_GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8085:8000"
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8085
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: db_tokowebii
      DB_USERNAME: tokoonline
      DB_PASSWORD: "${TOKO_DB_PASSWORD:?Set TOKO_DB_PASSWORD in .env}"
      SESSION_DRIVER: file
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
    command:
      - php
      - artisan
      - serve
      - --host=0.0.0.0
      - --port=8000
      - --no-reload
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: db_tokowebii
      MYSQL_USER: tokoonline
      MYSQL_PASSWORD: "${TOKO_DB_PASSWORD:?Set TOKO_DB_PASSWORD in .env}"
      MYSQL_ROOT_PASSWORD: "${TOKO_DB_ROOT_PASSWORD:?Set TOKO_DB_ROOT_PASSWORD in .env}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h127.0.0.1 -u"$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1"'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql_data:
